<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMGTUFF v1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><p>FORMATO BINÁRIO PRÓPRIO · V1</p><h1>IMG<span>TUFF</span></h1><strong>67 × 67 · RGBA8 · CRC-32</strong></header>
    <section>
      <h2>Criar .imgtuff</h2>
      <p>Escolha uma imagem. Ela será sempre redimensionada para 67×67.</p>
      <input id="source" type="file" accept="image/*">
      <button id="encode" disabled>Baixar .imgtuff</button>
      <output id="encode-status"></output>
    </section>
    <section>
      <h2>Abrir .imgtuff</h2>
      <p>O arquivo é validado e aberto aqui mesmo, sem converter para outro formato.</p>
      <input id="encoded" type="file" accept=".imgtuff,application/octet-stream">
      <output id="decode-status"></output>
      <canvas id="preview" width="67" height="67" hidden aria-label="Imagem IMGTUFF aberta"></canvas>
      <pre id="info" hidden></pre>
    </section>
    <footer>100% local · <a href="README.md" target="_blank">especificação IMGTUFF v1</a></footer>
  </main>
  <script src="imgtuff.js"></script>
</body>
</html>
